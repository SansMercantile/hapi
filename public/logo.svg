<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Deep futuristic gradients -->
    <linearGradient id="hapiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />  <!-- Cyber Teal -->
      <stop offset="50%" stop-color="#3b82f6" /> <!-- Electric Blue -->
      <stop offset="100%" stop-color="#ec4899" /> <!-- Plasma Pink -->
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop shadow filter for glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="100" height="100" rx="20" fill="url(#glowGrad)" />

  <!-- Animated Coordinate Grid / Ring (Concentric Orbitals) -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" />
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#hapiGrad)" stroke-width="1" stroke-opacity="0.3">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 50 50" 
      to="360 50 50" 
      dur="20s" 
      repeatCount="indefinite" />
  </circle>

  <!-- Intersecting Supply Lines (Symbolizing Flow and Coordination) -->
  <!-- Line 1: Fluid wave across -->
  <path id="waypoint1" d="M 20 50 Q 35 25, 50 50 T 80 50" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <path d="M 20 50 Q 35 25, 50 50 T 80 50" fill="none" stroke="url(#hapiGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 150">
    <animate 
      attributeName="stroke-dashoffset" 
      values="160;0" 
      dur="3s" 
      repeatCount="indefinite" />
  </path>

  <!-- Line 2: Intersecting wave mirror -->
  <path id="waypoint2" d="M 20 50 Q 35 75, 50 50 T 80 50" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 20 50 Q 35 75, 50 50 T 80 50" fill="none" stroke="url(#hapiGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 150">
    <animate 
      attributeName="stroke-dashoffset" 
      values="0;160" 
      dur="4.2s" 
      repeatCount="indefinite" />
  </path>

  <!-- Primary Orchestration Target Nodes (Hubs) -->
  <circle cx="20" cy="50" r="4.5" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
  <circle cx="50" cy="50" r="5.5" fill="#0f172a" stroke="url(#hapiGrad)" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="80" cy="50" r="4.5" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />

  <!-- Orbiting Logistics Satellite Nodes -->
  <circle cx="50" cy="50" r="1.5" fill="#f43f5e" filter="url(#glow)">
    <!-- Move node along vector coordinate space -->
    <animateMotion 
      dur="3.6s" 
      repeatCount="indefinite"
      path="M 20 50 Q 35 25, 50 50 T 80 50" />
  </circle>

  <circle cx="50" cy="50" r="1.5" fill="#10b981" filter="url(#glow)">
    <animateMotion 
      dur="4.8s" 
      repeatCount="indefinite"
      path="M 20 50 Q 35 75, 50 50 T 80 50" />
  </circle>

  <!-- Pulsing Hub Core animation -->
  <circle cx="50" cy="50" r="8" fill="url(#hapiGrad)" opacity="0.15">
    <animate 
      attributeName="r" 
      values="6;11;6" 
      dur="2s" 
      repeatCount="indefinite" />
    <animate 
      attributeName="opacity" 
      values="0.3;0.05;0.3" 
      dur="2s" 
      repeatCount="indefinite" />
  </circle>
</svg>
